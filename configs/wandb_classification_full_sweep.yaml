# Create the full-dataset sweep:
# wandb sweep --project personalized-methylation-full-sweep /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/configs/wandb_classification_full_sweep.yaml
# Then submit one Slurm array task per trial using the printed sweep id.
program: /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/src/wandb_sweep_training.py
method: grid
metric:
  name: eval_loss
  goal: minimize
parameters:
  learning_rate:
    values:
    - 1.0e-06
    - 1.0e-05
    - 3.0e-05
  batch_size:
    values:
    - 1
    - 5
    - 14
command:
- python3
- /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/src/wandb_sweep_training.py
- --base-config
- /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/configs/wandb_classification_full_training.yaml
- --sample-name
- Z000000R3
- --resume
