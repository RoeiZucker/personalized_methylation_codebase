paths:
  assemblies:
    HG38: /sci/archive/michall/roeizucker/reference_genome/hg38.fa
    MM10: /sci/archive/michall/roeizucker/reference_genome/mm10.fa
  generetor_cache_dir: /sci/archive/michall/roeizucker/huggingface_modles_cache/datasets/generator
  train_dataset_path:
  - /sci/labs/michall/roeizucker/huggingface_datasets_dir/wandb_classification_smoke/liver_r3_classification_train
  eval_dataset_path:
  - /sci/labs/michall/roeizucker/huggingface_datasets_dir/wandb_classification_smoke/liver_r3_classification_eval
  output_dir: /sci/labs/michall/roeizucker/trained_huggingface_models_location/wandb_classification_training_output
task:
  task_type: cpg_training
  analysis_name: wandb_classification_liver_r3_500m
  top_rows: -1
testing_params:
  test_mode: false
random_state: 42
verbose: true
model:
  model_name: nucleotide-transformer-500m-human-ref
  model_repo: InstaDeepAI
  model_type: classification_analysis
  blank_label: -100
  use_lora: false
  freeze_model: true
  num_labels: 3
train:
  load_best_model_at_end: false
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  learning_rate: 1.0e-06
  metric_for_best_model: mcc
  save_stratagy: steps
  lora_over_finetuned: false
  load_dataset_to_memory: false
  min_number_of_cpg_sites: -1
  max_grad_norm: 1
  number_of_steps: 200
  save_total_limit: 1
  add_epoch_end_save_callback: false
  add_epoch_end_prediction: false
  save_at_end: false
  continue_from_last: false
  eval_steps: 1000
  logging_steps: 500
wandb:
  enabled: true
  project: personalized-methylation-smoke
  entity: null
  name: wandb_classification_liver_r3_500m
  group: wandb-classification
  tags:
  - classification
  - liver
  - smoke-long
  mode: online
