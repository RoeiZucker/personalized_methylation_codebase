# Create the sweep from the repo root:
# wandb sweep /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/configs/wandb_classification_sweep.yaml
# Then run an agent from the repo root:
# wandb agent ENTITY/personalized-methylation-smoke/SWEEP_ID
program: /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/src/wandb_sweep_training.py
method: grid
metric:
  name: eval_loss
  goal: minimize
parameters:
  learning_rate:
    values:
      - 1.0e-06
      - 1.0e-05
      - 3.0e-05
  batch_size:
    values:
      - 1
      - 5
      - 14
command:
  - python3
  - /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/src/wandb_sweep_training.py
  - --base-config
  - /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/configs/wandb_classification_training.yaml
  - --sample-name
  - R3
