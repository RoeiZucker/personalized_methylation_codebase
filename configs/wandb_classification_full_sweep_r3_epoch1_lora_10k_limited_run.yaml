# Create the R3 epoch-1-pretrain LoRA sweep:
# wandb sweep --project personalized-methylation-r3-epoch1-lora-10k /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/configs/wandb_classification_full_sweep_r3_epoch1_lora_10k_limited_run.yaml
# Then submit one Slurm array task per trial using the printed sweep id.
program: /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/src/wandb_sweep_training.py
method: grid
metric:
  name: eval/loss
  goal: minimize
parameters:
  learning_rate:
    values:
    - 1.0e-05
    - 3.0e-05
  batch_size:
    values:
    - 14
  use_lora:
    values:
    - true
  lora_r:
    values:
    - 1
    - 4
    - 8
  lora_alpha:
    values:
    - 16
  lora_dropout:
    values:
    - 0.1
  lora_target_modules:
    values:
    - query,value
command:
- python3
- /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/src/wandb_sweep_training.py
- --base-config
- /cs/usr/roeizucker/new_storage/jupyter_notebooks/Tom_Hope_Project/refactored_code/configs/wandb_classification_full_training_r3_epoch1_lora_10k_limited_run.yaml
- --sample-name
- Z000000R3
- --resume
